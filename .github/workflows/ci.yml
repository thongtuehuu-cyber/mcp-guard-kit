name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q
      - run: python -m mcp_guard benchmark --trials 60 --seed 42 --json-out bench.json
      - run: python -m mcp_guard audit --md-out audit.md --html-out audit.html

  worker-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test cloudflare_worker/test/commerce.test.mjs
