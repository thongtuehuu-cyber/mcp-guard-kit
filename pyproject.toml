[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-guard-kit"
version = "1.1.0"
description = "Zero-dependency MCP tool fault-injection & anti-hallucination verifier for AI agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "thongtuehuu-cyber" }]
keywords = ["mcp", "ai-agents", "fault-injection", "testing", "llm", "verification"]

[project.scripts]
mcp-guard = "mcp_guard.cli:main"

[tool.setuptools.packages.find]
include = ["mcp_guard*"]
